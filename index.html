
!DOCTYPE html>
<html lang="en">
<head>

    <title>Jeza - Developer Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 450px;

            background: #161b22;

        .card {

        ul { margin: 0; padding-left: 20px; font-size: 14px; }
        li { margin-bottom: 6px; }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-link {
            display: block;
            background: #238636;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-link:hover {
